{% extends "base.html" %}

{% block title %}Authentication Bypass - hackthis{% endblock %}

{% block content %}

<section>
    <h1>Admin Login</h1>

    <p>Login to access the administration panel.</p>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/sql/auth-bypass">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">Login</button>

    </form>
</section>

{% endblock %}
